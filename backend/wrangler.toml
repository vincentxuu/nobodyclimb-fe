name = "nobodyclimb-api"

main = "src/index.ts"

compatibility_date = "2024-12-01"

compatibility_flags = ["nodejs_compat"]

account_id = "1ff43f0d4c3ad3bd98ce5ab767546a68"

# ============================================
# Local Development Bindings
# ============================================

[[d1_databases]]
binding = "DB"
database_name = "nobodyclimb-db-local"
database_id = "local"

[[kv_namespaces]]
binding = "CACHE"
id = "local"

# Workers AI Binding (local dev)
[ai]
binding = "AI"

# ============================================
# Cron Triggers
# ============================================

[triggers]
crons = ["0 16 * * *", "0 0 * * 1"]  # UTC 16:00 = 台灣 00:00 每日重置；UTC 週一 00:00 = 台灣週一 08:00 人格演化

# ============================================

# 測試環境 (Preview)

# ============================================

[env.preview]

name = "nobodyclimb-api-preview"

routes = [
  { pattern = "api-preview.nobodyclimb.cc/*", zone_name = "nobodyclimb.cc" }
]

 

[env.preview.vars]

CORS_ORIGIN = "https://preview.nobodyclimb.cc,http://localhost:3000"

JWT_ISSUER = "nobodyclimb-api"

R2_PUBLIC_URL = "https://storage-preview.nobodyclimb.cc"

AI_GATEWAY_SLUG = "nobodyclimb-preview"

ANALYTICS_DATASET = "nobodyclimb_access_logs_preview"

# Google OAuth - Set via wrangler secret or environment variable
# GOOGLE_CLIENT_ID = "your-google-client-id.apps.googleusercontent.com"

# Langfuse Observability - Set via wrangler secret:
# wrangler secret put LANGFUSE_PUBLIC_KEY --env preview
# wrangler secret put LANGFUSE_SECRET_KEY --env preview
# wrangler secret put LANGFUSE_BASEURL --env preview
# LANGFUSE_BASEURL 預設為 https://cloud.langfuse.com，如使用 self-hosted 才需設定

# AI Provider API Keys - Set via wrangler secret:
# wrangler secret put OPENAI_API_KEY --env preview
# wrangler secret put ANTHROPIC_API_KEY --env preview
# wrangler secret put GOOGLE_AI_API_KEY --env preview
# LLM provider selection (cloudflare | openai | anthropic | google), default: cloudflare
# LLM_PROVIDER = "cloudflare"
# Embedding provider (cloudflare | openai | google), default: same as LLM_PROVIDER
# WARNING: Changing EMBEDDING_PROVIDER requires full re-index of all documents in Vectorize
# EMBEDDING_PROVIDER = "cloudflare"



[[env.preview.d1_databases]]

binding = "DB"

database_name = "nobodyclimb-db-preview"

database_id = "9870775a-8490-4f88-b72f-cf535c9fcb56"

migrations_dir = "migrations"

 

[[env.preview.kv_namespaces]]

binding = "CACHE"

id = "396df52e16864a35a3cb7898fcd686e7"

 

[[env.preview.r2_buckets]]

binding = "STORAGE"

bucket_name = "nobodyclimb-storage-preview"



[[env.preview.analytics_engine_datasets]]

binding = "ACCESS_LOGS"

dataset = "nobodyclimb_access_logs_preview"



# Workers AI Binding

[env.preview.ai]

binding = "AI"



# Vectorize Binding

[[env.preview.vectorize]]

binding = "VECTOR_INDEX"

index_name = "nobodyclimb-routes-preview"



# ============================================

# 正式環境 (Production)

# ============================================

[env.production]

name = "nobodyclimb-api-production"

routes = [

  { pattern = "api.nobodyclimb.cc/*", zone_name = "nobodyclimb.cc" }

]

 

[env.production.vars]

CORS_ORIGIN = "https://nobodyclimb.cc"

JWT_ISSUER = "nobodyclimb-api"

R2_PUBLIC_URL = "https://storage.nobodyclimb.cc"

AI_GATEWAY_SLUG = "nobodyclimb"

ANALYTICS_DATASET = "nobodyclimb_access_logs"

# Google OAuth - Set via wrangler secret or environment variable
# GOOGLE_CLIENT_ID = "your-google-client-id.apps.googleusercontent.com"

# Langfuse Observability - Set via wrangler secret:
# wrangler secret put LANGFUSE_PUBLIC_KEY --env production
# wrangler secret put LANGFUSE_SECRET_KEY --env production
# wrangler secret put LANGFUSE_BASEURL --env production
# LANGFUSE_BASEURL 預設為 https://cloud.langfuse.com，如使用 self-hosted 才需設定

# AI Provider API Keys - Set via wrangler secret:
# wrangler secret put OPENAI_API_KEY --env production
# wrangler secret put ANTHROPIC_API_KEY --env production
# wrangler secret put GOOGLE_AI_API_KEY --env production
# LLM provider selection (cloudflare | openai | anthropic | google), default: cloudflare
# LLM_PROVIDER = "cloudflare"
# Embedding provider (cloudflare | openai | google), default: same as LLM_PROVIDER
# WARNING: Changing EMBEDDING_PROVIDER requires full re-index of all documents in Vectorize
# EMBEDDING_PROVIDER = "cloudflare"



[[env.production.d1_databases]]

binding = "DB"

database_name = "nobodyclimb-db"

database_id = "d2e7214f-5b2a-46ff-af47-ab0bda5d9b86"

migrations_dir = "migrations"

 

[[env.production.kv_namespaces]]

binding = "CACHE"

id = "608d1fb3c4424146abe50ab56e246aca"

 

[[env.production.r2_buckets]]

binding = "STORAGE"

bucket_name = "nobodyclimb-storage"



[[env.production.analytics_engine_datasets]]

binding = "ACCESS_LOGS"

dataset = "nobodyclimb_access_logs"



# Workers AI Binding

[env.production.ai]

binding = "AI"



# Vectorize Binding

[[env.production.vectorize]]

binding = "VECTOR_INDEX"

index_name = "nobodyclimb-routes"